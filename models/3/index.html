<!doctype html>
<html lang="en" dir="ltr" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>The Route | M.H.C for Manufacturing &amp; Export</title>
  <meta name="description" content="From Alexandria to the world: M.H.C charcoal shipping routes and a container calculator.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050912">
  <link rel="icon" type="image/png" href="../../assets/logo/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="../../shared/kit.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <div class="tags" id="tags" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#top" aria-label="M.H.C"><span class="mark" data-logo="dark"></span><span class="bt"><b>M.H.C</b><small data-t="company.short"></small></span></a>
    <nav class="nav" data-nav data-each="nav"><a data-href="$.href" data-t="$.t"></a></nav>
    <a class="cta" href="#contact" data-t="hero.cta"></a>
    <button class="burger" type="button" data-menu-toggle data-al="ui.menu"><i></i><i></i></button>
  </header>

  <main id="top">
    <section id="hero" class="hero">
      <div class="wrap">
        <div class="h-text">
          <p class="eyebrow" data-t="hero.eyebrow"></p>
          <h1 data-split data-h="models.2.hero"></h1>
          <p class="lead" data-t="hero.sub"></p>
          <div class="row">
            <a class="btn" href="#contact" data-t="hero.cta"></a>
            <a class="btn ghost" href="#export" data-t="export.calc.title"></a>
          </div>
        </div>
      </div>
      <div class="voyage" id="voyage">
        <div class="v-top"><span class="v-from" data-t="export.origin.name"></span><i></i><b id="vPort"></b></div>
        <div class="v-row"><div><small id="vLand"></small></div><div class="v-day"><b id="vDay" class="ltr">0</b><small>/ <span id="vMax" class="ltr"></span> <span data-t="export.daysWord"></span></small></div></div>
        <div class="v-bar"><i id="vBar"></i></div>
        <p class="v-note" data-t="export.routesNote"></p>
      </div>
      <div class="ports-wrap"><ul class="ports" id="ports" data-each="export.routes"><li><button type="button"><b data-t="$.port"></b><span class="ltr" data-t="$.range"></span></button></li></ul></div>
    </section>

    <section id="about" class="sec">
      <div class="wrap">
        <div class="panel half">
          <p class="kicker" data-t="about.kicker"></p>
          <h2 data-split data-t="about.title"></h2>
          <p class="body" data-t="about.body" data-r></p>
          <ul class="stats" data-each="about.stats"><li data-r><b data-t="$.n" data-n></b><span data-t="$.k"></span></li></ul>
        </div>
        <ol class="tl half" data-each="about.timeline"><li data-r><time class="ltr" data-t="$.d"></time><div><h3 data-t="$.t"></h3><p data-t="$.x"></p></div></li></ol>
      </div>
    </section>

    <section id="products" class="sec">
      <div class="wrap">
        <div class="head"><p class="kicker" data-t="products.kicker"></p><h2 data-split data-t="products.title"></h2></div>
        <div class="prods" data-each="products.items">
          <article class="prod" data-r>
            <span class="p-i" data-idx></span>
            <h3 data-t="$.name"></h3>
            <p class="p-tag" data-t="$.tag"></p>
            <p class="p-d" data-t="$.desc"></p>
            <dl data-each="$.specRows"><div><dt data-t="$.k"></dt><dd data-t="$.v"></dd></div></dl>
            <p class="p-pack" data-t="$.pack"></p>
          </article>
        </div>
        <p class="note" data-t="products.note"></p>
      </div>
    </section>

    <section id="export" class="sec calc">
      <div class="wrap">
        <div class="panel half">
          <p class="kicker" data-t="export.kicker"></p>
          <h2 data-t="export.calc.title"></h2>
          <p class="body" data-t="export.body"></p>
          <div class="c-group">
            <small data-t="export.calc.product"></small>
            <div class="chips" id="cProd" data-each="products.items"><button type="button" data-t="$.name"></button></div>
          </div>
          <div class="c-group">
            <small data-t="export.calc.box"></small>
            <div class="chips" id="cBox" data-each="export.containers"><button type="button" data-t="$.name"></button></div>
          </div>
          <div class="c-res">
            <div><b id="rTons" class="ltr">0</b><span data-t="export.calc.tons"></span></div>
            <div><b id="rBags" class="ltr">0</b><span data-t="export.calc.bags"></span></div>
          </div>
          <p class="note" data-t="export.calc.note"></p>
        </div>
      </div>
    </section>

    <section id="terms" class="sec">
      <div class="wrap">
        <div class="panel half">
          <ul class="terms" data-each="export.terms"><li data-r><b class="ltr" data-t="$.k"></b><span data-t="$.v"></span></li></ul>
          <h3 data-t="export.docsTitle"></h3>
          <ul class="docs" data-each="export.docs"><li data-t="$"></li></ul>
          <p class="note"><span data-t="export.hs.k"></span>: <b class="ltr" data-t="export.hs.v"></b></p>
        </div>
      </div>
    </section>

    <section id="process" class="sec">
      <div class="wrap">
        <div class="head"><p class="kicker" data-t="process.kicker"></p><h2 data-split data-t="process.title"></h2></div>
      </div>
      <ol class="steps" data-each="process.steps">
        <li><span class="s-i" data-idx></span><h3 data-t="$.t"></h3><p data-t="$.x"></p></li>
      </ol>
    </section>

    <section id="label" class="sec">
      <div class="wrap">
        <div class="panel half">
          <p class="kicker" data-t="label.kicker"></p>
          <h2 data-split data-t="label.title"></h2>
          <p class="body" data-t="label.body" data-r></p>
          <ul class="pts" data-each="label.points"><li data-r><h3 data-t="$.t"></h3><p data-t="$.x"></p></li></ul>
        </div>
      </div>
    </section>

    <section id="trust" class="sec">
      <div class="wrap">
        <div class="head"><p class="kicker" data-t="trust.kicker"></p><h2 data-split data-t="trust.title"></h2><p class="body" data-t="trust.body" data-r></p></div>
        <ul class="certs" data-each="trust.items"><li data-r><h3 data-t="$.k"></h3><p data-t="$.by"></p><b class="ltr" data-t="$.no"></b></li></ul>
      </div>
    </section>

    <section id="faq" class="sec">
      <div class="wrap">
        <div class="panel half">
          <p class="kicker" data-t="faq.kicker"></p>
          <h2 data-t="faq.title"></h2>
          <div class="qa" data-each="faq.items"><details><summary data-t="$.q"></summary><p data-t="$.a"></p></details></div>
        </div>
      </div>
    </section>

    <section id="contact" class="sec">
      <div class="wrap">
        <div class="panel half wide">
          <p class="kicker" data-t="contact.kicker"></p>
          <h2 data-t="contact.title"></h2>
          <div data-quote-form></div>
          <div class="reach">
            <ul class="addr" data-each="company.addresses"><li><b data-t="$.k"></b><a data-href="$.map" target="_blank" rel="noopener" data-t="$.v"></a></li></ul>
            <ul class="phones" data-each="company.phones"><li><a class="ltr" data-href="$.href" data-t="$.d"></a></li></ul>
            <p class="row"><a class="btn" data-href="company.whatsappHref" target="_blank" rel="noopener" data-t="contact.whatsapp"></a><a class="btn ghost ltr" data-href="company.mailHref" data-t="company.email"></a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap"><span class="mark" data-logo="dark"></span><p><b data-t="company.name"></b><br><small data-t="company.legal"></small></p><small>© <span class="ltr">2026</span> M.H.C · <span data-t="ui.rights"></span></small></div>
  </footer>

  <script src="../../shared/content.js"></script>
  <script src="../../shared/logo.js"></script>
  <script src="../../shared/land.js"></script>
  <script src="../../shared/kit.js" data-model="3"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>
